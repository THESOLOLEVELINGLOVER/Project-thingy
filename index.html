<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        /* Clean, centered layout matching your About Me page */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 2rem 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            text-align: center;
            box-sizing: border-box;
        }

        .container {
            background: white;
            padding: 3.5rem 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 2.8rem;
            color: #2c3e50;
        }

        .subtitle {
            font-size: 1.25rem;
            font-weight: 600;
            color: #3498db;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2.2rem;
            line-height: 1.6;
        }

        mark {
            background-color: #d6eaf8;
            color: #2c3e50;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Subtle highlight box matching your list styling */
        .welcome-banner {
            background-color: #f8f9fa;
            margin: 0 auto 2.2rem auto;
            padding: 14px 18px;
            border-radius: 8px;
            color: #444;
            font-size: 1rem;
            border-left: 4px solid #3498db;
            max-width: 440px;
        }

        /* Button styling */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            background-color: #3498db;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        /* Secondary button style for external links */
        .btn-secondary {
            background-color: #0056b3;
        }

        .btn-secondary:hover {
            background-color: #003d82;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome!</h1>
        <p class="subtitle">Thanks for stopping by my corner of the web</p>
        
        <p>Glad you're here! Feel free to explore to learn more about my <mark>hobbies, projects, and interests</mark>, or check out my links below.</p>

        <div class="welcome-banner">
            🏊 Swimming &nbsp;•&nbsp; 🏸 Badminton &nbsp;•&nbsp; 🔧 Tech Repair &nbsp;•&nbsp; 🎮 Gaming
        </div>

        <div class="button-group">
            <!-- Links directly to your About Me page -->
            <a href="about.html" class="btn">About Me</a>
            <!-- Your existing external links -->
            <a href="https://www.youtube.com/@exoled202" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">YouTube Channel</a>
            <a href="https://lifesavingsociety.com" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">Lifesaving Course</a>
        </div>
    </div>

</body>
</html>
